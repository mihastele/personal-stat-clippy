<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatClippy Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-dark-800 min-h-screen p-6 border-r border-gray-700">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-purple-500 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">StatClippy</h1>
          <p class="text-xs text-gray-400">Admin Panel</p>
        </div>
      </div>
      
      <nav class="space-y-1">
        <button onclick="showSection('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Overview
        </button>
        <button onclick="showSection('music')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="music">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
          Music Stats
        </button>
        <button onclick="showSection('gaming')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="gaming">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
          Gaming Stats
        </button>
        <button onclick="showSection('github')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="github">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub Stats
        </button>
        <button onclick="showSection('chess')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="chess">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
          Chess Stats
        </button>
        <button onclick="showSection('config')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-dark-700 hover:text-white transition-all" data-section="config">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          API Config
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
      <!-- Dashboard Section -->
      <section id="section-dashboard" class="section">
        <h2 class="text-2xl font-bold mb-6">Dashboard Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <p class="text-gray-400 text-sm">Music - Total Minutes</p>
            <p id="dash-music" class="text-2xl font-bold mt-1">--</p>
          </div>
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <p class="text-gray-400 text-sm">Gaming - Total Hours</p>
            <p id="dash-gaming" class="text-2xl font-bold mt-1">--</p>
          </div>
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <p class="text-gray-400 text-sm">GitHub - Contributions</p>
            <p id="dash-github" class="text-2xl font-bold mt-1">--</p>
          </div>
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <p class="text-gray-400 text-sm">Chess - Rapid Rating</p>
            <p id="dash-chess" class="text-2xl font-bold mt-1">--</p>
          </div>
        </div>
        
        <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
          <h3 class="text-lg font-semibold mb-4">Quick Actions</h3>
          <div class="flex flex-wrap gap-3">
            <button onclick="syncService('spotify')" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-all">Sync Spotify</button>
            <button onclick="syncService('steam')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-all">Sync Steam</button>
            <button onclick="syncService('github')" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-all">Sync GitHub</button>
            <button onclick="syncService('chess')" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-lg transition-all">Sync Chess.com</button>
          </div>
        </div>
      </section>

      <!-- Music Section -->
      <section id="section-music" class="section hidden">
        <h2 class="text-2xl font-bold mb-6">Music Stats</h2>
        <form id="music-form" class="bg-dark-800 rounded-xl p-6 border border-gray-700">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Minutes Listened</label>
              <input type="number" name="total_minutes" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Songs Played</label>
              <input type="number" name="total_songs" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Artists</label>
              <input type="number" name="total_artists" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <button type="submit" class="px-6 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg transition-all">Save Changes</button>
        </form>
      </section>

      <!-- Gaming Section -->
      <section id="section-gaming" class="section hidden">
        <h2 class="text-2xl font-bold mb-6">Gaming Stats</h2>
        <form id="gaming-form" class="bg-dark-800 rounded-xl p-6 border border-gray-700">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Playtime (hours)</label>
              <input type="number" name="total_playtime" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Games</label>
              <input type="number" name="total_games" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Achievements Unlocked</label>
              <input type="number" name="achievements_unlocked" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Perfect Games</label>
              <input type="number" name="perfect_games" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <button type="submit" class="px-6 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg transition-all">Save Changes</button>
        </form>
      </section>

      <!-- GitHub Section -->
      <section id="section-github" class="section hidden">
        <h2 class="text-2xl font-bold mb-6">GitHub Stats</h2>
        <form id="github-form" class="bg-dark-800 rounded-xl p-6 border border-gray-700">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Repos</label>
              <input type="number" name="total_repos" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Commits</label>
              <input type="number" name="total_commits" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Stars</label>
              <input type="number" name="total_stars" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Followers</label>
              <input type="number" name="total_followers" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Contributions</label>
              <input type="number" name="total_contributions" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Current Streak</label>
              <input type="number" name="current_streak" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Longest Streak</label>
              <input type="number" name="longest_streak" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <button type="submit" class="px-6 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg transition-all">Save Changes</button>
        </form>
      </section>

      <!-- Chess Section -->
      <section id="section-chess" class="section hidden">
        <h2 class="text-2xl font-bold mb-6">Chess Stats</h2>
        <form id="chess-form" class="bg-dark-800 rounded-xl p-6 border border-gray-700">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Rapid Rating</label>
              <input type="number" name="rating_rapid" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Blitz Rating</label>
              <input type="number" name="rating_blitz" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Bullet Rating</label>
              <input type="number" name="rating_bullet" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Total Games</label>
              <input type="number" name="total_games" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Wins</label>
              <input type="number" name="wins" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Losses</label>
              <input type="number" name="losses" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Draws</label>
              <input type="number" name="draws" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
              <label class="block text-sm text-gray-400 mb-2">Puzzle Rating</label>
              <input type="number" name="puzzle_rating" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2">Puzzles Solved</label>
              <input type="number" name="puzzles_solved" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-sky-500 focus:outline-none">
            </div>
          </div>
          <button type="submit" class="px-6 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg transition-all">Save Changes</button>
        </form>
      </section>

      <!-- API Config Section -->
      <section id="section-config" class="section hidden">
        <h2 class="text-2xl font-bold mb-6">API Configuration</h2>
        <div class="space-y-4">
          <!-- Spotify Config -->
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-lg bg-green-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
              </div>
              <h3 class="text-lg font-semibold">Spotify</h3>
            </div>
            <form class="config-form" data-service="spotify">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-sm text-gray-400 mb-2">Client ID</label>
                  <input type="text" name="client_id" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-green-500 focus:outline-none">
                </div>
                <div>
                  <label class="block text-sm text-gray-400 mb-2">Client Secret</label>
                  <input type="password" name="client_secret" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-green-500 focus:outline-none">
                </div>
              </div>
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" name="enabled" class="w-4 h-4 rounded">
                  <span class="text-sm text-gray-400">Enable Spotify Integration</span>
                </label>
                <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-all">Save</button>
              </div>
            </form>
          </div>

          <!-- Steam Config -->
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
              </div>
              <h3 class="text-lg font-semibold">Steam</h3>
            </div>
            <form class="config-form" data-service="steam">
              <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">API Key</label>
                <input type="password" name="api_key" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-blue-500 focus:outline-none">
              </div>
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" name="enabled" class="w-4 h-4 rounded">
                  <span class="text-sm text-gray-400">Enable Steam Integration</span>
                </label>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-all">Save</button>
              </div>
            </form>
          </div>

          <!-- GitHub Config -->
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-lg bg-purple-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-purple-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
              </div>
              <h3 class="text-lg font-semibold">GitHub</h3>
            </div>
            <form class="config-form" data-service="github">
              <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Personal Access Token</label>
                <input type="password" name="api_key" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-purple-500 focus:outline-none">
              </div>
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" name="enabled" class="w-4 h-4 rounded">
                  <span class="text-sm text-gray-400">Enable GitHub Integration</span>
                </label>
                <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-all">Save</button>
              </div>
            </form>
          </div>

          <!-- Chess.com Config -->
          <div class="bg-dark-800 rounded-xl p-6 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-lg bg-amber-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
              </div>
              <h3 class="text-lg font-semibold">Chess.com</h3>
            </div>
            <form class="config-form" data-service="chess">
              <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Chess.com Username</label>
                <input type="text" name="api_key" class="w-full px-4 py-2 bg-dark-900 border border-gray-600 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Your Chess.com username">
              </div>
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" name="enabled" class="w-4 h-4 rounded">
                  <span class="text-sm text-gray-400">Enable Chess.com Integration</span>
                </label>
                <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-lg transition-all">Save</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 px-6 py-3 bg-green-600 text-white rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
    <span id="toast-message">Saved successfully!</span>
  </div>

  <script>
    const API_BASE = ''

    // Show section
    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'))
      document.getElementById(`section-${section}`).classList.remove('hidden')
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-dark-700', 'text-white')
        btn.classList.add('text-gray-300')
      })
      document.querySelector(`[data-section="${section}"]`).classList.add('bg-dark-700', 'text-white')
      document.querySelector(`[data-section="${section}"]`).classList.remove('text-gray-300')
      
      if (section !== 'dashboard' && section !== 'config') {
        loadStats(section)
      }
    }

    // Show toast
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast')
      const toastMessage = document.getElementById('toast-message')
      toastMessage.textContent = message
      toast.classList.remove('bg-green-600', 'bg-red-600')
      toast.classList.add(isError ? 'bg-red-600' : 'bg-green-600')
      toast.classList.remove('translate-y-20', 'opacity-0')
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0')
      }, 3000)
    }

    // Load dashboard
    async function loadDashboard() {
      try {
        const res = await fetch(`${API_BASE}/api/stats/dashboard`)
        const data = await res.json()
        
        document.getElementById('dash-music').textContent = data.music?.total_minutes?.toLocaleString() || '0'
        document.getElementById('dash-gaming').textContent = data.gaming?.total_playtime?.toLocaleString() || '0'
        document.getElementById('dash-github').textContent = data.github?.total_contributions?.toLocaleString() || '0'
        document.getElementById('dash-chess').textContent = data.chess?.rating_rapid || '1200'
      } catch (e) {
        console.error('Failed to load dashboard:', e)
      }
    }

    // Load stats for a section
    async function loadStats(section) {
      try {
        const res = await fetch(`${API_BASE}/api/stats/${section}`)
        const data = await res.json()
        const form = document.getElementById(`${section}-form`)
        
        if (data.stats) {
          Object.keys(data.stats).forEach(key => {
            const input = form.querySelector(`[name="${key}"]`)
            if (input) input.value = data.stats[key]
          })
        }
      } catch (e) {
        console.error(`Failed to load ${section} stats:`, e)
      }
    }

    // Sync service
    async function syncService(service) {
      try {
        const res = await fetch(`${API_BASE}/api/sync/${service}`, { method: 'POST' })
        const data = await res.json()
        showToast(data.message || `${service} synced!`)
        loadDashboard()
      } catch (e) {
        showToast(`Failed to sync ${service}`, true)
      }
    }

    // Form submissions
    document.getElementById('music-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const data = Object.fromEntries(formData)
      
      try {
        await fetch(`${API_BASE}/api/stats/music`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        showToast('Music stats saved!')
        loadDashboard()
      } catch (e) {
        showToast('Failed to save', true)
      }
    })

    document.getElementById('gaming-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const data = Object.fromEntries(formData)
      
      try {
        await fetch(`${API_BASE}/api/stats/gaming`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        showToast('Gaming stats saved!')
        loadDashboard()
      } catch (e) {
        showToast('Failed to save', true)
      }
    })

    document.getElementById('github-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const data = Object.fromEntries(formData)
      
      try {
        await fetch(`${API_BASE}/api/stats/github`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        showToast('GitHub stats saved!')
        loadDashboard()
      } catch (e) {
        showToast('Failed to save', true)
      }
    })

    document.getElementById('chess-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const data = Object.fromEntries(formData)
      
      try {
        await fetch(`${API_BASE}/api/stats/chess`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        showToast('Chess stats saved!')
        loadDashboard()
      } catch (e) {
        showToast('Failed to save', true)
      }
    })

    // Config form submissions
    document.querySelectorAll('.config-form').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const service = form.dataset.service
        const formData = new FormData(form)
        const data = {
          client_id: formData.get('client_id') || '',
          client_secret: formData.get('client_secret') || '',
          api_key: formData.get('api_key') || '',
          enabled: formData.get('enabled') === 'on'
        }
        
        try {
          await fetch(`${API_BASE}/api/config/${service}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          })
          showToast(`${service} config saved!`)
        } catch (e) {
          showToast('Failed to save config', true)
        }
      })
    })

    // Initialize
    showSection('dashboard')
    loadDashboard()
  </script>
</body>
</html>
