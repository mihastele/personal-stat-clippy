services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: statclippy-backend
    init: true
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SERVE_FRONTEND=false
    volumes:
      - statclippy_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/stats/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: statclippy-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  statclippy_data:
    driver: local
