version: '3.8'

services:
  statclippy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statclippy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      # Persist SQLite database
      - statclippy_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/stats/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  statclippy_data:
    driver: local
